apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: college
  template:
    metadata:
      labels:
        app: college
    spec:
      containers:
      - name: college
        image: richadevops/college-portal:latest
        ports:
        - containerPort: 5000
